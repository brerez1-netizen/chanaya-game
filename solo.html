<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0e1420">
<title>תכנון חניון תת קרקעי</title>
<style>
  :root{
    --bg:#0e1420; --panel:#18202f; --panel2:#1f2a3d; --line:#2c3a52;
    --txt:#eaf0fa; --dim:#93a4bf; --accent:#4ea3f0; --ok:#28c076; --bad:#e5484d;
    --book:#f0b429; --acc:#8e6bff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:var(--bg);color:var(--txt);min-height:100vh;
       font-family:"Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--panel);
       border-bottom:1px solid var(--line);position:sticky;top:0;z-index:9;flex-wrap:wrap}
  .brand{font-size:18px;font-weight:700;color:var(--accent)}
  .spacer{flex:1}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:18px;
        padding:4px 12px;font-size:14px;color:var(--dim);white-space:nowrap}
  .pill b{color:var(--txt);font-size:16px}
  .pill.good{border-color:rgba(40,192,118,.6);color:#8fe3b8}
  .pill.warn{border-color:rgba(240,180,41,.6);color:#f4dfae}

  .wrap{flex:1;width:100%;max-width:1240px;margin:0 auto;padding:18px 16px 60px;
        display:flex;flex-direction:column;gap:16px}
  h1{font-size:27px;color:var(--accent)}
  h2{font-size:20px}
  .lead{font-size:16px;line-height:1.65;color:#c3d0e4}
  .lead b{color:var(--book)}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .brief dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:16px;margin-top:10px}
  .brief dt{color:var(--dim)}
  .brief dd{font-weight:600}

  .answers{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .ans{display:flex;gap:12px;align-items:flex-start;text-align:start;background:var(--panel2);
       border:2px solid var(--line);border-radius:12px;padding:13px 15px;font-size:16px;
       line-height:1.45;font-weight:600;color:var(--txt);font-family:inherit;cursor:pointer}
  .ans .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--panel);
          display:flex;align-items:center;justify-content:center;font-size:15px}
  .ans.right{border-color:var(--ok);background:rgba(40,192,118,.14)}
  .ans.right .n{background:var(--ok);color:#06210f}
  .ans.wrong{border-color:var(--bad);background:rgba(229,72,77,.14)}
  .ans.dim{opacity:.45}
  .ans:disabled{cursor:default}

  .booknote{background:rgba(240,180,41,.10);border:1px solid rgba(240,180,41,.35);
            border-radius:12px;padding:13px 15px;font-size:15px;line-height:1.55;color:#f4dfae}
  .booknote b{color:var(--book)}
  .explain{background:var(--panel2);border-inline-start:4px solid var(--accent);border-radius:10px;
           padding:13px 15px;font-size:15px;line-height:1.6;color:#dce6f5}

  .planwrap{background:#101724;border:1px solid var(--line);border-radius:14px;padding:8px;overflow-x:auto}
  svg{display:block;min-width:820px;width:100%;height:auto}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--dim);margin-top:8px}
  .legend i{display:inline-block;width:13px;height:13px;border-radius:3px;margin-inline-end:6px;vertical-align:-2px}

  .bays{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:12px}
  .bay{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
  .bay.bad{border-color:rgba(229,72,77,.6)}
  .bay.good{border-color:rgba(40,192,118,.45)}
  .bay .hd{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .bay .num{background:var(--panel2);border:1px solid var(--line);border-radius:7px;
            padding:1px 9px;font-weight:700;font-size:15px}
  .bay .span{font-size:14px;color:var(--dim)}
  .bay .sum{font-size:13px;color:var(--dim);margin:5px 0 7px;direction:ltr;text-align:right}
  .bay .sum.over{color:#ff9ea1}
  .stallrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
  .stallrow select{flex:1;background:var(--panel2);color:var(--txt);border:1px solid var(--line);
                   border-radius:8px;padding:6px 7px;font-family:inherit;font-size:14px}
  .stallrow .x{background:var(--panel2);color:var(--dim);border:1px solid var(--line);border-radius:8px;
               width:28px;height:30px;cursor:pointer;font-family:inherit;font-size:15px}
  .bay .add{background:var(--panel2);color:var(--txt);border:1px dashed var(--line);border-radius:8px;
            padding:6px 12px;cursor:pointer;font-family:inherit;font-size:14px;width:100%}
  .bay .add:disabled{opacity:.4;cursor:default}
  .bay .msg{font-size:13px;line-height:1.5;color:#ff9ea1;margin-top:6px}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  button.go{font-family:inherit;font-size:17px;font-weight:700;padding:13px 22px;border:none;
            border-radius:11px;background:var(--accent);color:#04182b;cursor:pointer}
  button.go.ghost{background:var(--panel2);color:var(--txt);border:1px solid var(--line)}

  .sum3{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .stat .k{font-size:13px;color:var(--dim);line-height:1.4}
  .stat .v{font-size:30px;font-weight:700;margin:3px 0 2px}
  .stat.bad .v{color:var(--bad)} .stat.good .v{color:var(--ok)}
  .hidden{display:none!important}
</style>
</head>
<body>

<div class="bar">
  <span class="brand">תכנון חניון תת קרקעי</span>
  <span class="pill hidden" id="pillLevel"></span>
  <span class="spacer"></span>
  <span class="pill hidden" id="pillCount"></span>
  <span class="pill hidden" id="pillAcc"></span>
</div>

<div class="wrap" id="wrap"></div>

<script src="js/rules.js"></script>
<script src="js/board.js"></script>
<script>
/* =====================================================================
   תרגול אישי לשיעור 21, חניה.

   הסטודנט מקבל קליפה של קומת מרתף קיימת ומתכנן בתוכה את תאי החניה: כמה
   תאים בכל מפרץ, מאיזה סוג, ובאיזה רוחב. הבדיקה מול פרק 26 נעשית רק
   בהגשה, כדי לאלץ לפתוח את הספר במקום לנסות עד שנדלק ירוק.
   ===================================================================== */
const R = window.ParkingRules;
const B = window.parkingBoard;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

const BRIEF = {
  units: 26,
  zone: "ב'",
  quotaPerUnit: 1.0,
  get quota() { return R.roundUpStalls(this.units * this.quotaPerUnit); },
  accessibleRegular: 1,      // טבלת 19.1, טווח 6 עד 30 מקומות
  accessibleTall: 0,
};

const QUESTIONS = [
  {
    id: "level",
    q: "לפי איזו רמת שרות מתכננים את החניון הזה?",
    hint: "רמת השרות קובעת את כל טבלת המידות. התשובה בפרק 26.",
    options: [
      { t: "רמת שרות 3, כי המשתמשים הם דיירים קבועים ולא מבקרים אקראיים", ok: false,
        why: "סוג המשתמשים הוא אחד השיקולים שהמסמך מונה, אבל לא המתכנן קובע לפיו. ההגדרה היא של הרשות המקומית." },
      { t: "רמת שרות 1, כי הרשות המקומית לא הגדירה אזורי רמות שרות במרחב התכנון", ok: true,
        why: "בהעדר הגדרה של הרשות המקומית חובה להתקין חניונים ברמת שרות 1, שהיא המחמירה מכולן." },
      { t: "רמת שרות 2, כי זה בניין מגורים ולא מבנה ציבור", ok: false,
        why: "רמות השרות לא נקבעות לפי סוג הבניין אלא לפי הגדרת הרשות המקומית, ובהעדר הגדרה חלה רמה 1." },
      { t: "אין רמות שרות בחניון פרטי, המידות אחידות לכל חניון", ok: false,
        why: "יש שלוש רמות שרות, ולכל אחת טבלה שלמה. רמה 1 דורשת תאים רחבים יותר מרמה 3 באותו רוחב מעבר." },
    ],
    where: "פרק 26, סעיף ב.4, עמוד 293",
  },
  {
    id: "acc",
    q: "כמה מקומות חניה נגישים צריך בחניון הזה?",
    hint: "בבניין מגורים זו לא הטבלה של מבנה ציבור. חפש את הפרק שעוסק במגורים.",
    options: [
      { t: "תא נגיש אחד לרכב רגיל ותא נגיש אחד לרכב גבוה", ok: false,
        why: "זו השורה של 31 עד 75 מקומות. בחניון הזה 26 מקומות, כלומר השורה שמעליה." },
      { t: "שניים לרכב רגיל ואחד לרכב גבוה", ok: false,
        why: "זו השורה של 76 עד 150 מקומות." },
      { t: "תא נגיש אחד לרכב רגיל, בלי תא לרכב גבוה", ok: true,
        why: "בטווח של 6 עד 30 מקומות נדרש תא נגיש אחד לרכב רגיל בלבד. שים לב שהתא הזה **מתווסף** למכסה ואינו נכלל בה, וזה כתוב במפורש בפרק 26 סעיף א'." },
      { t: "אין חובת חניה נגישה בבניין מגורים פרטי", ok: false,
        why: "החובה חלה על כל בניין מגורים חדש שבו שש דירות או יותר עם כניסה משותפת." },
    ],
    where: "פרק 19.1, נגישות בבנייני מגורים, עמוד 203",
  },
];

const WIDTHS = [2.30, 2.40, 2.50, 2.60, 2.70, 2.80, 2.90, 3.00, 3.20, 3.50, 4.00, 4.60];
const KINDS = [
  { v: "regular", t: "תא רגיל" },
  { v: "accessible", t: "נגיש, רכב רגיל" },
  { v: "accessibleTall", t: "נגיש, רכב גבוה" },
];

let S = freshState();

function freshState() {
  const bays = [];
  B.rows.forEach((row, ri) => row.spans.forEach((sp, si) => {
    bays.push({ id: ri + "-" + si, row: ri, x0: sp.x0, x1: sp.x1, clear: sp.clear,
                y0: row.y0, y1: row.y1, left: sp.left, right: sp.right, stalls: [] });
  }));
  bays.forEach((b, i) => (b.no = i + 1));
  return { phase: "q", qi: 0, picks: {}, level: null, bays, verdict: null };
}

const totalStalls = () => S.bays.reduce((n, b) => n + b.stalls.length, 0);
const countAcc = () => S.bays.reduce((n, b) => n + b.stalls.filter((s) => s.kind !== "regular").length, 0);

function paintBar() {
  const inPlan = S.phase === "plan" || S.phase === "verdict";
  $("pillLevel").classList.toggle("hidden", !S.level);
  $("pillLevel").textContent = S.level ? "רמת שרות " + S.level : "";
  $("pillCount").classList.toggle("hidden", !inPlan);
  $("pillAcc").classList.toggle("hidden", !inPlan);
  if (!inPlan) return;
  const n = totalStalls() - countAcc(), a = countAcc();
  $("pillCount").innerHTML = "תאים רגילים: <b>" + n + "</b> מתוך " + BRIEF.quota + " נדרשים";
  $("pillCount").className = "pill " + (n >= BRIEF.quota ? "good" : "warn");
  $("pillAcc").innerHTML = "נגישים: <b>" + a + "</b> מתוך " + BRIEF.accessibleRegular;
  $("pillAcc").className = "pill " + (a >= BRIEF.accessibleRegular ? "good" : "warn");
}

/* ---------------------- שאלות הפתיחה ---------------------- */
function renderQuestion() {
  const Q = QUESTIONS[S.qi];
  const pick = S.picks[Q.id];
  const picked = pick !== undefined;
  $("wrap").innerHTML = `
    ${S.qi === 0 ? briefCard() : ""}
    <div class="card">
      <h2>${esc(Q.q)}</h2>
      <p class="lead" style="margin-top:6px">${esc(Q.hint)}</p>
      <div class="answers" id="ansbox"></div>
      <div id="after"></div>
    </div>`;
  const box = $("ansbox");
  box.innerHTML = Q.options.map((o, i) => {
    let cls = "ans";
    if (picked) cls += o.ok ? " right" : (i === pick ? " wrong" : " dim");
    return `<button class="${cls}" data-i="${i}" ${picked ? "disabled" : ""}>
      <span class="n">${i + 1}</span><span>${esc(o.t)}</span></button>`;
  }).join("");
  if (!picked) {
    box.querySelectorAll(".ans").forEach((b) => {
      b.onclick = () => { S.picks[Q.id] = +b.dataset.i; render(); };
    });
    return paintBar();
  }
  const o = Q.options[pick];
  const last = S.qi === QUESTIONS.length - 1;
  $("after").innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px;margin-top:14px">
      <div class="booknote"><b>איפה זה בספר:</b> ${esc(Q.where)}</div>
      <div class="explain">${o.why.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")}</div>
      <button class="go" id="next">${last ? "לתכנון" : "לשאלה הבאה"}</button>
    </div>`;
  $("next").onclick = () => {
    if (last) { S.level = 1; S.phase = "plan"; } else { S.qi++; }
    render();
  };
  paintBar();
}

function briefCard() {
  return `
    <h1>תכנון חניון תת קרקעי</h1>
    <div class="card brief">
      <h2>התדריך</h2>
      <p class="lead">קיבלת קומת מרתף קיימת. הקירות, רשת העמודים, קירות הממ"ד והמעבר כבר יצוקים
      ואי אפשר להזיז אותם. התפקיד שלך לתכנן בתוכם את תאי החניה.</p>
      <dl>
        <dt>שימוש</dt><dd>בניין מגורים, ${BRIEF.units} יחידות דיור</dd>
        <dt>אזור מתע"ן</dt><dd>אזור ${BRIEF.zone}</dd>
        <dt>מכסה שקבעה הוועדה</dt><dd>${BRIEF.quotaPerUnit} מקומות ליחידת דיור, כלומר ${BRIEF.quota} מקומות</dd>
        <dt>רוחב המעבר בקומה</dt><dd>${B.aisle.width.toFixed(2)} מ', ונקבע מהמרחק בין שתי שורות התאים</dd>
        <dt>עומק שורת תאים</dt><dd>${B.stallLength.toFixed(2)} מ'</dd>
      </dl>
    </div>`;
}

/* ---------------------- ציור התוכנית ---------------------- */
const PAD = 1.4;
function planSvg() {
  const W = B.width + PAD * 2, H = B.height + PAD * 2;
  const sy = (y) => (B.height - y) + PAD;
  let s = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="aspect-ratio:${W}/${H}">`;
  s += `<rect x="0" y="0" width="${W}" height="${H}" fill="#101724"/>`;
  s += `<rect x="${PAD}" y="${sy(B.height)}" width="${B.width}" height="${B.height}"
         fill="#18202f" stroke="#2c3a52" stroke-width="0.07"/>`;

  const a = B.aisle;
  s += `<rect x="${PAD}" y="${sy(a.y1)}" width="${B.width}" height="${a.y1 - a.y0}" fill="#22304a"/>`;
  s += `<text x="${PAD + B.width * 0.5}" y="${sy((a.y0 + a.y1) / 2) + 0.3}" fill="#7fb2e6"
         font-size="0.8" text-anchor="middle" font-family="Segoe UI,Arial">מעבר ${a.width.toFixed(2)}</text>`;

  if (B.ramp) {
    const r = B.ramp;
    s += `<rect x="${PAD + r.x0}" y="${sy(r.y1)}" width="${r.x1 - r.x0}" height="${r.y1 - r.y0}" fill="#2b3a56"/>`;
  }

  (B.mamads || []).forEach((m) => {
    s += `<rect x="${PAD + m.x0}" y="${sy(m.y1)}" width="${m.x1 - m.x0}" height="${m.y1 - m.y0}"
           fill="#3d4a68" stroke="#8ea2bf" stroke-width="0.16"/>`;
    s += `<text x="${PAD + (m.x0 + m.x1) / 2}" y="${sy((m.y0 + m.y1) / 2) + 0.22}" fill="#c3d0e4"
           font-size="0.6" text-anchor="middle" font-family="Segoe UI,Arial">${esc(m.label)}</text>`;
  });

  s += `<line x1="${PAD}" y1="${sy(0)}" x2="${PAD + B.width}" y2="${sy(0)}" stroke="#8ea2bf" stroke-width="0.24"/>`;
  s += `<line x1="${PAD}" y1="${sy(B.height)}" x2="${PAD + B.width}" y2="${sy(B.height)}" stroke="#8ea2bf" stroke-width="0.24"/>`;

  S.bays.forEach((bay) => {
    const v = S.verdict ? S.verdict.bays[bay.id] : null;
    const stroke = v ? (v.legal ? "#28c076" : "#e5484d") : "#3b4a66";
    s += `<rect x="${PAD + bay.x0}" y="${sy(bay.y1)}" width="${bay.clear}" height="${bay.y1 - bay.y0}"
           fill="none" stroke="${stroke}" stroke-width="0.1" stroke-dasharray="0.45 0.32"/>`;

    let x = bay.x0;
    bay.stalls.forEach((st) => {
      const isAcc = st.kind !== "regular";
      s += `<rect x="${PAD + x}" y="${sy(bay.y1)}" width="${st.w}" height="${bay.y1 - bay.y0}"
             fill="${isAcc ? "rgba(142,107,255,.5)" : "rgba(78,163,240,.42)"}"
             stroke="${isAcc ? "#8e6bff" : "#4ea3f0"}" stroke-width="0.055"/>`;
      s += `<text x="${PAD + x + st.w / 2}" y="${sy((bay.y0 + bay.y1) / 2) + 0.2}" fill="#e8eefb"
             font-size="0.55" text-anchor="middle" font-family="Segoe UI,Arial">${st.w.toFixed(2)}</text>`;
      x += st.w;
    });

    // מספר המפרץ, בקצה שרחוק מהמעבר
    const ny = bay.row === 1 ? bay.y1 - 0.85 : bay.y0 + 0.85;
    s += `<circle cx="${PAD + bay.x0 + 0.8}" cy="${sy(ny)}" r="0.62" fill="#101724" stroke="#4ea3f0" stroke-width="0.08"/>`;
    s += `<text x="${PAD + bay.x0 + 0.8}" y="${sy(ny) + 0.25}" fill="#9ec9f2" font-size="0.72"
           text-anchor="middle" font-family="Segoe UI,Arial" font-weight="700">${bay.no}</text>`;
  });

  B.columns.forEach((c) => {
    s += `<rect x="${PAD + c.x0}" y="${sy(c.y0 + c.h)}" width="${c.w}" height="${c.h}" fill="#c0392b"/>`;
  });
  s += `</svg>`;
  return s;
}

/* ---------------------- מסך התכנון ---------------------- */
function renderPlan() {
  $("wrap").innerHTML = `
    <div class="card">
      <h2>הקומה שקיבלת</h2>
      <p class="lead" style="margin-top:4px">${S.bays.length} מפרצים בין העמודים, ולכל אחד מרווח פנוי אחר.
      בכל מפרץ תחליט כמה תאים, מאיזה סוג, ובאיזה רוחב. את הרוחב המינימלי תמצא בטבלה ב.4 בעמוד 294.</p>
      <div class="planwrap" id="plan"></div>
      <div class="legend">
        <span><i style="background:rgba(78,163,240,.6)"></i>תא רגיל</span>
        <span><i style="background:rgba(142,107,255,.7)"></i>תא נגיש</span>
        <span><i style="background:#c0392b"></i>עמוד</span>
        <span><i style="background:#3d4a68"></i>קיר ממ"ד</span>
        <span><i style="background:#22304a"></i>מעבר</span>
      </div>
    </div>
    <h2>המפרצים</h2>
    <div class="bays" id="bays"></div>
    <div class="row">
      <button class="go" id="submit">הגשה לבדיקת רשות הרישוי</button>
      <button class="go ghost" id="clear">ניקוי הכל</button>
    </div>`;
  $("plan").innerHTML = planSvg();
  $("bays").innerHTML = S.bays.map(bayCard).join("");
  wireBays();
  $("submit").onclick = () => { S.verdict = judge(); S.phase = "verdict"; render(); };
  $("clear").onclick = () => { S.bays.forEach((b) => (b.stalls = [])); render(); };
  paintBar();
}

const boundName = (k) => (k === "column" ? "עמוד" : k === "mamad" ? "קיר ממ\"ד" : "קיר");

function bayCard(bay) {
  const sum = Math.round(bay.stalls.reduce((a, s) => a + s.w, 0) * 100) / 100;
  const over = sum > bay.clear + 0.005;
  return `<div class="bay" data-bay="${bay.id}">
    <div class="hd"><span class="num">${bay.no}</span>
      <span class="span">מרווח ${bay.clear.toFixed(2)} מ', בין ${boundName(bay.left)} ל${boundName(bay.right)}</span></div>
    <div class="sum ${over ? "over" : ""}">${sum.toFixed(2)} / ${bay.clear.toFixed(2)}</div>
    ${bay.stalls.map((st, i) => `
      <div class="stallrow">
        <select data-bay="${bay.id}" data-i="${i}" data-f="kind">
          ${KINDS.map((k) => `<option value="${k.v}" ${k.v === st.kind ? "selected" : ""}>${k.t}</option>`).join("")}
        </select>
        <select data-bay="${bay.id}" data-i="${i}" data-f="w" style="max-width:88px">
          ${WIDTHS.map((w) => `<option value="${w}" ${Math.abs(w - st.w) < 1e-6 ? "selected" : ""}>${w.toFixed(2)}</option>`).join("")}
        </select>
        <button class="x" data-bay="${bay.id}" data-i="${i}" data-act="del">x</button>
      </div>`).join("")}
    <button class="add" data-bay="${bay.id}" data-act="add" ${bay.stalls.length >= 4 ? "disabled" : ""}>הוספת תא</button>
  </div>`;
}

function wireBays() {
  document.querySelectorAll('.bay [data-act="add"]').forEach((b) => {
    b.onclick = () => {
      S.bays.find((x) => x.id === b.dataset.bay).stalls.push({ kind: "regular", w: 2.40 });
      render();
    };
  });
  document.querySelectorAll('.bay [data-act="del"]').forEach((b) => {
    b.onclick = () => {
      S.bays.find((x) => x.id === b.dataset.bay).stalls.splice(+b.dataset.i, 1);
      render();
    };
  });
  document.querySelectorAll(".bay select").forEach((sel) => {
    sel.onchange = () => {
      const st = S.bays.find((x) => x.id === sel.dataset.bay).stalls[+sel.dataset.i];
      if (sel.dataset.f === "kind") {
        st.kind = sel.value;
        if (st.kind === "accessible" && st.w < 3.50) st.w = 3.50;
        if (st.kind === "accessibleTall" && st.w < 4.60) st.w = 4.60;
      } else {
        st.w = parseFloat(sel.value);
      }
      render();
    };
  });
}

/* ---------------------- פסיקה ---------------------- */
function judge() {
  const bays = {};
  let illegal = 0, regular = 0, accReg = 0, accTall = 0;
  S.bays.forEach((b) => {
    const res = R.checkDesign({ level: S.level, aisle: B.aisle.width, stalls: b.stalls, clearSpan: b.clear });
    bays[b.id] = res;
    if (res.legal) {
      regular += b.stalls.filter((s) => s.kind === "regular").length;
      accReg += b.stalls.filter((s) => s.kind === "accessible").length;
      accTall += b.stalls.filter((s) => s.kind === "accessibleTall").length;
    } else if (b.stalls.length) illegal++;
  });
  return {
    bays, regular, accReg, accTall, illegal,
    quotaOk: regular >= BRIEF.quota,
    accOk: accReg >= BRIEF.accessibleRegular && accTall >= BRIEF.accessibleTall,
    approved: regular >= BRIEF.quota && accReg >= BRIEF.accessibleRegular && illegal === 0,
  };
}

function renderVerdict() {
  const v = S.verdict;
  $("wrap").innerHTML = `
    <h1>${v.approved ? "התכנון אושר" : "התכנון חוזר לתיקון"}</h1>
    <div class="sum3">
      <div class="stat ${v.quotaOk ? "good" : "bad"}"><div class="k">תאים רגילים חוקיים</div>
        <div class="v">${v.regular}</div><div class="k">מתוך ${BRIEF.quota} נדרשים</div></div>
      <div class="stat ${v.accOk ? "good" : "bad"}"><div class="k">תאים נגישים</div>
        <div class="v">${v.accReg}</div><div class="k">מתוך ${BRIEF.accessibleRegular} נדרשים, ומתווספים למכסה</div></div>
      <div class="stat ${v.illegal ? "bad" : "good"}"><div class="k">מפרצים שנפסלו</div>
        <div class="v">${v.illegal}</div><div class="k">מתוך ${S.bays.length}</div></div>
    </div>
    <div class="planwrap" id="plan"></div>
    <div class="booknote"><b>הבדיקה נעשתה מול:</b> טבלה ב.4 בעמוד 294 לרוחב התא לפי רוחב המעבר,
      וסעיף ב.3 בעמוד 293 לתא נגיש. במעבר של ${B.aisle.width.toFixed(2)} מ' וברמת שרות ${S.level}:
      תא יחיד בין עמודים ${R.requiredWidth(S.level, B.aisle.width, "between", 1).width.toFixed(2)} מ',
      תא ליד עמוד ${R.requiredWidth(S.level, B.aisle.width, "beside", 1).width.toFixed(2)} מ',
      ותא בשטח פנוי ${R.requiredWidth(S.level, B.aisle.width, "open", 1).width.toFixed(2)} מ'.</div>
    <h2>מפרץ אחר מפרץ</h2>
    <div class="bays" id="bays"></div>
    <div class="row">
      <button class="go" id="back">חזרה לתיקון</button>
      <button class="go ghost" id="restart">להתחיל מחדש</button>
    </div>`;
  $("plan").innerHTML = planSvg();
  $("bays").innerHTML = S.bays.map((b) => verdictCard(b, v.bays[b.id])).join("");
  $("back").onclick = () => { S.phase = "plan"; S.verdict = null; render(); };
  $("restart").onclick = () => { S = freshState(); render(); };
  paintBar();
}

function verdictCard(bay, r) {
  if (!bay.stalls.length) {
    return `<div class="bay"><div class="hd"><span class="num">${bay.no}</span>
      <span class="span">מרווח ${bay.clear.toFixed(2)} מ', נשאר ריק</span></div></div>`;
  }
  const rows = r.parts.map((p) => `
    <div class="stallrow" style="font-size:14px;gap:10px">
      <span style="color:${p.ok ? "#8fe3b8" : "#ff9ea1"};font-weight:700;min-width:44px">${p.w.toFixed(2)}</span>
      <span style="color:var(--dim);flex:1">${esc(p.why)}, מינימום ${p.min.toFixed(2)}</span>
    </div>`).join("");
  return `<div class="bay ${r.legal ? "good" : "bad"}">
    <div class="hd"><span class="num">${bay.no}</span>
      <span class="span">${r.legal ? "עובר" : "נפסל"} · מרווח ${bay.clear.toFixed(2)} מ'</span></div>
    <div class="sum ${r.sum > bay.clear + 0.005 ? "over" : ""}">${r.sum.toFixed(2)} / ${bay.clear.toFixed(2)}</div>
    ${rows}
    ${r.legal ? "" : `<div class="msg">${esc(r.note)}</div>`}
  </div>`;
}

function render() {
  if (S.phase === "q") return renderQuestion();
  if (S.phase === "plan") return renderPlan();
  return renderVerdict();
}
render();
</script>
